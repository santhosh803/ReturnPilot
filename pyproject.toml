[project]
name = "returnpilot"
version = "0.1.0"
description = "AI-powered eCommerce returns management platform with MCP server and LangGraph agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "celery>=5.6.3",
    "dj-database-url>=3.1.2",
    "django>=5.2.17",
    "django-cors-headers>=4.9.0",
    "django-filter>=26.1",
    "djangorestframework>=3.18.0",
    "faker>=40.36.0",
    "google-cloud-aiplatform>=1.164.0",
    "gunicorn>=26.0.0",
    "langchain>=1.3.15",
    "langchain-core>=1.5.5",
    "langchain-google-genai>=4.3.4",
    "langchain-google-vertexai>=3.2.4",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "mcp>=2.0.0",
    "psycopg2-binary>=2.9.12",
    "python-dotenv>=1.2.3",
    "redis>=8.1.0",
    "whitenoise>=6.12.0",
]
